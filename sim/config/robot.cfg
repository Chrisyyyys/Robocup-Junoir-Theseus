# Theseus simulator: robot, field and scoring settings.
#
# Values marked GUESS are estimates. Measure them on the real robot and update
# them here; that is what makes the simulator match reality. See sim/README.md
# ("Calibrating the simulator") for how to measure each one.
#
# Coordinates on the robot: x = mm to the right of the robot's centre,
# y = mm forward of the centre. Angles: 0 = forward, 90 = right, 180 = back, 270 = left.

# ---------------------------------------------------------------- robot body
robot.length_mm = 170                 # same as ROBOT_LENGTH_MM in Main.ino
robot.width_mm = 140                  # same as ROBOT_WIDTH_MM in Main.ino
robot.start_angle_error_deg = 0       # how crooked the robot is placed on the start tile

# ---------------------------------------------------------------- drive train
# Shield port -> side of the robot and direction (-1 = mounted reversed).
# From motors.cpp: A(1) and C(3) are the left side, B(2) and D(4) the right side, D reversed.
motor.1 = left 1
motor.2 = right 1
motor.3 = left 1
motor.4 = right -1

drive.wheel_diameter_mm = 80          # from Main.ino
drive.encoder_counts_per_rev = 975    # 5 counts per motor turn (rising edges of channel A) x 195:1 gearbox
drive.max_speed_mm_s = 210            # GUESS: wheel speed at PWM 255 (Pololu 20D 195:1 ~52 rpm x 80 mm wheel)
drive.deadband_straight_pwm = 18      # GUESS: lowest PWM that makes the robot drive straight. fwd() exits at PWM 25, so the real value is probably below 25
drive.deadband_turn_pwm = 35          # GUESS: lowest PWM that makes the robot turn on the spot. absoluteturn() keeps turning at PWM 20 until its timer runs out, so the real value is probably above 20
drive.motor_tau_s = 0.08              # GUESS: how quickly a wheel reaches a new speed
drive.track_mm = 130                  # GUESS: distance between left and right wheels
drive.wheelbase_mm = 120              # GUESS: distance between front and back wheels
drive.skid_factor = 1.5               # GUESS: 4-wheel skid steering turns slower than the wheel speeds suggest
drive.slip = 0.02                     # robot moves 2% less than the wheels turn
drive.gain_spread = 0.04              # each motor is randomly up to 4% faster/slower than the others
drive.yaw_noise_deg_per_m = 1.5       # random heading wander while driving (deg per sqrt(metre))
drive.slope_slowdown = 0.8            # speed loss on ramps: speed x (1 - 0.8 x sin(slope))
drive.blocked_wheel_spin = 0.3        # when pushing against a wall, wheels (and encoders) keep turning at 30%
drive.encoder_noise = 0.01
drive.battery_factor = 1.0            # 0.9 = battery 10% weaker

# Encoders: motor port, interrupt pin (channel A), direction pin (channel B), level of
# channel B when the wheel turns forward. Pins from Main.ino; levels chosen so that
# driving forward counts up, as fwd() expects.
encoder.A = 1 3 5 1
encoder.B = 2 2 4 0
encoder.D = 4 18 19 0

# ---------------------------------------------------------------- distance sensors (VL53L0X)
# tof.N = x y angle mux_port     (N = the number used in measure(N))
# Ports follow portMap[] in measure(). Positions are GUESSES from the code's comments:
# 1/7 front, 2 (front) and 3 (back) right side, 6 (front) and 5 (back) left side, 4 back.
tof.1 = 35 85 0 1
tof.7 = -35 85 0 2
tof.2 = 70 50 90 0
tof.3 = 70 -50 90 6
tof.4 = 0 -85 180 4
tof.5 = -70 -50 270 5
tof.6 = -70 50 270 3
tof.height_mm = 40                    # GUESS: beam height above the floor
tof.timing_budget_ms = 33             # Pololu library default -> a new reading every ~33 ms
tof.max_range_mm = 1200
tof.min_range_mm = 30
tof.noise_mm = 3                      # random error of each reading
tof.noise_fraction = 0.01             # plus 1% of the distance
tof.bias_spread_mm = 4                # each sensor reads up to 4 mm long or short
tof.cone_deg = 25                     # field of view of the VL53L0X
tof.cone_rays = 9                     # beams traced across the cone (returns are weighted by angle and distance)
tof.dropout_prob = 0.002              # chance that a reading returns "nothing in range"
tof.spike_prob = 0.001                # chance of a random short reading
tof.out_of_range_value = 8190         # what the sensor returns when nothing is in range
tof.warm_address = 0x30               # address the sensors keep after a warm reset (setAddress(0x30))

# ---------------------------------------------------------------- gyro (BNO055)
gyro.noise_deg = 0.1
gyro.drift_deg_per_min = 0.5
gyro.start_offset_deg = 0             # heading reported at power-on (NDOF mode can report the compass heading)
gyro.pitch_noise_deg = 0.3
gyro.pitch_sign = 1                   # 1 = nose up reads positive, as fwd() assumes

# ---------------------------------------------------------------- colour sensor (TCS34725 on mux port 7)
color.port = 7
color.position = 0 70                 # GUESS: x y of the sensor (it must be ahead of the centre to see black tiles first)
# Raw r g b c for each floor at 24 ms / 1x gain. GUESSES chosen to match the thresholds in
# Main.ino (silver r > 800, black c/clear < 0.1, white c/clear > 0.85). Paste real readings here.
color.white = 520 560 540 1650
color.black = 40 45 42 120
color.blue = 180 290 520 1000
color.silver = 1100 1150 1100 3400
color.noise = 0.03

# ---------------------------------------------------------------- cameras (OpenMV, one per side)
# camera.side = x y angle serial_port   (left camera on Serial4, right camera on Serial3)
camera.left = -70 0 270 4
camera.right = 70 0 90 3
camera.fov_deg = 60
camera.range_mm = 260
camera.height_mm = 70
camera.fps = 20                       # one byte per frame while a victim is in view
camera.misread_prob = 0.03            # chance a frame reports the wrong letter
camera.idle_byte =                    # set e.g. to L if the camera sends a byte when it sees nothing
camera.idle_rate_hz = 0

# ---------------------------------------------------------------- pins
pins.pause_switch = 22                # logicswitch in Main.ino
pins.victim_led = 51                  # LEDPIN in Main.ino

# ---------------------------------------------------------------- field (RCJ Rescue Maze)
field.tile_mm = 300
field.wall_thickness_mm = 12
field.wall_height_mm = 150
field.ramp_angle_deg = 20             # rules: at most 25 degrees
field.bump_height_mm = 20             # rules: speed bumps at most 2 cm
field.bump_width_mm = 60
field.step_height_mm = 20             # rules: stairs, each step at most 2 cm
field.victim_height_mm = 70
field.obstacle_radius_mm = 40
field.obstacle_offset_mm = 80
field.debris_yaw_deg = 4              # extra heading wander on debris tiles
field.debris_encoder_noise = 0.08

# ---------------------------------------------------------------- scoring (approximate 2026 rules; check your official rules)
score.victim_linear = 10
score.victim_floating = 30
score.misidentification = -5
score.kit = 10
score.kits_H = 2
score.kits_S = 1
score.kits_U = 0
score.kits_R = 1
score.kits_Y = 1
score.kits_G = 0
score.checkpoint = 10
score.blue_first = 30
score.blue_revisit_penalty = 10
score.speed_bump = 5
score.stairs = 5
score.ramp = 10
score.exit_per_victim = 10
score.lop = 0
score.identify_distance_mm = 300

# ---------------------------------------------------------------- simulation
sim.time_limit_s = 480                # 8 minute run
sim.boot = warm                       # warm | cold (cold = fresh power-on)
sim.moves_limit = code                # code | off | N
sim.lack_of_progress = on
sim.max_lack_of_progress = 5
sim.stuck_s = 30
sim.idle_s = 60
sim.frame_dt_s = 0.05
sim.max_serial_lines = 150000
sim.watchdog_wall_s = 20
